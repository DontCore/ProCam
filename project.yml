name: ProCam
options:
  bundleIdPrefix: com.procam
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ProCam:
    type: application
    platform: iOS
    sources:
      - path: ProCam
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.procam.app
        PRODUCT_NAME: ProCam
        INFOPLIST_FILE: ProCam/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  ProCam:
    build:
      targets:
        ProCam: all
    run:
      config: Debug
    archive:
      config: Release
